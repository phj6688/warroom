name: CI

on:
  push:
    branches: [master, 'v4/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Audit production dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high
