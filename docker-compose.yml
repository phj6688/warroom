name: war-room

services:
  war-room:
    build: .
    container_name: war-room
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      # Secrets (OPENAI_API_KEY, WAR_ROOM_TOKEN, MCP_API_KEY, etc.)
      # are injected at runtime by the Infisical CLI in entrypoint.sh.
      # NEVER inline secrets here, docker-compose.yml is in git.
      INFISICAL_DOMAIN: http://infisical:8080
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_ENV: prod
      BASELINE_LOG: data/baseline-usage.jsonl
      IMPROVER_SYSTEM_PROMPT: ${IMPROVER_SYSTEM_PROMPT:-}
      EMBED_GATEWAY_URL: ${EMBED_GATEWAY_URL:-http://embed-gateway:8200}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      # Search provider: tavily (default), smart (SearXNG + DDG, no API cost),
      # or coexist (smart first, tavily fallback on empty/error).
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
      # SearXNG URL for smart / coexist. SearXNG is on librechat-net which
      # war-room is not attached to, the simplest wire is host-gateway via
      # extra_hosts below. Override if you attach war-room to librechat-net.
      SEARXNG_URL: ${SEARXNG_URL:-http://host.docker.internal:9090}
      # Scout search transport. false = legacy prose markers (default).
      # true  = Anthropic tool_use via lib/agents/tool-loop.js.
      SCOUT_USE_TOOL: ${SCOUT_USE_TOOL:-false}
      # Expand web_search to tier-B / tier-C agents. Independent of
      # SCOUT_USE_TOOL so scout can canary alone.
      AGENT_SEARCH_EXPANSION: ${AGENT_SEARCH_EXPANSION:-false}
      # Per-deliberation cross-agent search quota.
      SESSION_QUERY_BUDGET: ${SESSION_QUERY_BUDGET:-30}
    secrets:
      - infisical_client_id
      - infisical_client_secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    networks:
      - default
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8090/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=platform-net
      - traefik.http.routers.war-room.entrypoints=web
      - traefik.http.routers.war-room.rule=Host(`${WARROOM_HOST:-warroom.localhost}`)
      - traefik.http.routers.war-room.middlewares=forwardauth-zitadel@file
      - traefik.http.services.war-room.loadbalancer.server.port=8090

networks:
  default:
  platform-net:
    external: true

secrets:
  infisical_client_id:
    file: ./secrets/infisical_client_id
  infisical_client_secret:
    file: ./secrets/infisical_client_secret
