services:
  war-room:
    build: .
    container_name: war-room
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      # OPENAI_BASE_URL, OPENAI_API_KEY, WAR_ROOM_TOKEN, MCP_API_KEY,
      # MODEL, etc. are loaded from .env via env_file above. NEVER inline secrets
      # or gateway URLs here — docker-compose.yml is in git. See forge/hardening/SCARS.md §S03.
      - IMPROVER_SYSTEM_PROMPT=${IMPROVER_SYSTEM_PROMPT:-}
      - EMBEDDING_URL=${EMBEDDING_URL:-http://host.docker.internal:11434/api/embed}
      - EMBEDDING_MODEL=nomic-embed-text
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
